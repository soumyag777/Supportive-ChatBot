<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Buddy Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- step 1: pick a buddy -->
  <section class="card" id="pickScreen">
    <h1>✿ buddy bot ✿</h1>
    <p class="sub">pick a little friend to cheer you on</p>
    <div class="pets" id="petChoices"></div>
  </section>

  <!-- step 2: chat -->
  <section class="card hidden" id="chatScreen">
    <div class="buddy-header">
      <button class="back" id="backBtn" aria-label="Pick another buddy">‹</button>
      <div class="buddy" id="buddy" title="tap to pet!">
        <span id="buddyFace"></span>
      </div>
      <div class="buddy-info">
        <div class="buddy-name" id="buddyName"></div>
        <div class="pet-count">tap to pet · <span id="petCount">0</span> pets 💕</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="chips" id="chips"></div>

    <form class="composer" id="composer">
      <input id="input" type="text" placeholder="tell me how you're feeling..." autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
